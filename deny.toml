# cargo-deny configuration — run locally and before release (no hosted CI).
# With cargo-deny installed: cargo deny check
# Offline checks use the cached advisory database; freshness is a release check.

[graph]
# Check the Linux target we ship; avoids noise from platform-specific deps.
targets = [{ triple = "x86_64-unknown-linux-gnu" }]
all-features = false

[advisories]
# Fail the build on any known security advisory or unmaintained/yanked crate.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Add specific RUSTSEC IDs here only with a written justification.
ignore = [
    # zvariant / zvariant_derive / zbus_names 5.x are flagged "unmaintained"
    # because upstream moved on to zbus 6. They reach this tree only through
    # ashpd 0.13, oo7 0.6 and ksni 0.3, all of which still pin zbus 5; there is
    # no release of those crates on zbus 6 yet. These are D-Bus wire-format
    # crates talking to the local session bus, not network-facing code, and the
    # advisories carry no vulnerability. Drop these entries once ashpd, oo7 and
    # ksni ship zbus-6 releases.
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5: only via ashpd/oo7/ksni, which still require zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4: only via zbus 5, required by ashpd/oo7/ksni" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5: only via zbus 5, required by ashpd/oo7/ksni" },
]

[licenses]
# Allowlist of licenses acceptable for an MIT-licensed open-source distribution.
# Anything not listed fails the build, so a new dependency with a surprising
# (e.g. copyleft/strong-copyleft or unknown) license is caught before release.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
    # Public-domain dedication, no obligations on redistribution.
    # Used by ksni, whisper-rs and whisper-rs-sys.
    "Unlicense",
    # Permissive data licence covering the bundled Mozilla CA root store
    # (webpki-roots). Grants unrestricted use/redistribution of the data.
    "CDLA-Permissive-2.0",
    # BSD-style licence of libbzip2, carried by the pure-Rust port libbz2-rs-sys
    # (zip → bzip2). Permissive; requires only notice preservation.
    "bzip2-1.0.6",
]
confidence-threshold = 0.9
# Per-crate license clarifications go here if a crate ships an ambiguous license.
exceptions = []

[bans]
# Warn on duplicate versions of the same crate (bloat / drift), deny nothing by
# default so the build stays green; tighten to "deny" once the tree is clean.
multiple-versions = "warn"
wildcards = "allow"
# Crates we never want pulled in (placeholder — add known-bad crates here).
deny = []

[sources]
# Only crates.io and our own git sources are allowed; an unexpected registry or
# git source (a common supply-chain attack vector) fails the build.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

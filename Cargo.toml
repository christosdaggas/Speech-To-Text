[package]
name = "speech-to-text"
version = "1.0.0"
edition = "2021"
rust-version = "1.99"
authors = ["Christos A. Daggas"]
homepage = "https://chrisdaggas.com"
description = "Native Linux desktop application for offline speech-to-text transcription using Whisper"
license = "MIT AND Apache-2.0"
keywords = ["speech", "whisper", "transcription", "gtk", "gnome"]
categories = ["gui", "multimedia"]

[dependencies]
gtk4 = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_5"] }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "fs",
    "io-util",
] }

reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json", "multipart"], default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Whisper speech-to-text engine (whisper.cpp bindings). The sys crate is a
# direct dependency only so the `vulkan` feature below can reach it —
# whisper-rs dropped its own `vulkan` passthrough feature in 0.16.
whisper-rs = { version = "0.16", default-features = false }
whisper-rs-sys = "0.15"

cpal = "0.15"

rubato = "0.16"

symphonia = { version = "0.5", features = ["all"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dirs = "5"

thiserror = "2"

uuid = { version = "1", features = ["v4", "serde"] }

chrono = { version = "0.4", features = ["serde"] }

futures = "0.3"

# Internationalization. 0.8 is the first release that marks `setlocale` /
# `TextDomain::init` unsafe (RUSTSEC-2026-0244).
gettext-rs = { version = "0.8", features = ["gettext-system"] }

async-channel = "2"

# Runtime archives need decoders only, not encryption support.
zip = { version = "9", default-features = false, features = [
    "deflate-flate2-zlib-rs",
    "deflate64",
    "bzip2",
    "zstd",
] }

num_cpus = "1"

tar = "0.4"
bzip2 = "0.6"

oo7 = "0.6"

# PR_SET_PDEATHSIG for sidecar server processes (Linux-only app)
libc = "0.2"

# XDG Desktop Portals: global shortcuts + remote-desktop (auto-paste) + clipboard.
# The Clipboard portal lets us own the system selection from the (unfocused) mini
# panel via the same RemoteDesktop session, so the current transcript is pasted
# regardless of focus — see src/portal/paste.rs.
ashpd = { version = "0.13", features = ["global_shortcuts", "remote_desktop", "screencast", "clipboard"] }
# Bitflags for the RemoteDesktop DeviceType selection (already in the tree via ashpd).
enumflags2 = "0.7"
ksni = "0.3.4"

sha2 = "0.10"
# Secure temporary files for sidecar WAV input (exclusive, random, 0600)
tempfile = "3"
url = "2"

# Local HTTP API server (opt-in, localhost-only). A small hand-rolled hyper
# service — the route surface is tiny and we avoid pulling a full web framework
# (axum/tower) into a size-tuned desktop binary. reqwest already pulls hyper.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
multer = "3"
bytes = "1"

[build-dependencies]
cc = "1"

[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

[features]
default = []
gresource = []
cuda = ["whisper-rs/cuda"]
metal = ["whisper-rs/metal"]
# Vulkan GPU backend for whisper.cpp. Opt-in (like cuda/metal) so CPU-only
# builds don't require the Vulkan toolchain. Building this needs the Vulkan
# loader + headers and a GLSL compiler (glslc) to compile the compute shaders.
# Wired straight to the sys crate: whisper-rs 0.16 no longer forwards it.
vulkan = ["whisper-rs-sys/vulkan"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
